[pytest]
# importlib mode is required: the suite has several same-named test modules in
# different skills/tools directories, which the default "prepend" import mode
# cannot load together (it dies with "import file mismatch" during collection).
# See conftest.py for the sibling-import sys.path shim that pairs with this.
addopts = --import-mode=importlib --timeout=60 --timeout-method=signal
testpaths = tests skills tools

# Keep collection to real test modules; fixture dirs hold sample payloads and
# throwaway trees that are not themselves tests.
norecursedirs = .git .pytest_cache __pycache__ fixtures logs
